<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Era Uma Vez - Body UV50+</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#0E3C91",
            secondary: "#FF2829",
            accent: "#FFB902",
            brandGreen: "#94C856",
            "background-light": "#fdfdfd",
          },
          fontFamily: {
            sans: ["Source Sans Pro", "Open Sans", "sans-serif"],
            display: ["Fredoka", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "1rem",
            lg: "1.5rem",
            xl: "2.5rem",
          },
        },
      },
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .font-display {
      font-family: 'Fredoka', sans-serif;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    .logo-e {
      color: #0E3C91;
    }

    .logo-r {
      color: #FF2829;
    }

    .logo-a {
      color: #FFB902;
    }

    .logo-u {
      color: #94CC56;
    }

    .logo-m {
      color: #0E3C91;
    }

    .logo-a2 {
      color: #FF2829;
    }

    .logo-v {
      color: #FFB902;
    }

    .logo-e2 {
      color: #94CC56;
    }

    .logo-z {
      color: #0E3C91;
    }

    @keyframes whatsapp-ping {
      0% {
        transform: scale(1);
        opacity: 0.85;
      }

      75%,
      100% {
        transform: scale(1.9);
        opacity: 0;
      }
    }

    .animate-whatsapp-ping {
      animation: whatsapp-ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-whatsapp-ping {
        animation: none;
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>

<body class="bg-background-light text-[#1a1a1a] antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
